server:
  host: 0.0.0.0
  port: 8000

logging:
  file: /var/log/llm-proxy/requests.log
  level: INFO

backends:
  - name: default-ollama
    base_url: http://ollama-host:11434
    timeout_seconds: 120

clients:
  - name: example-client
    api_key: sk-proxy-example
    allowed_models:
      - openai_model: gpt-4o
        backend: default-ollama
        target_model: llama3
      - openai_model: gpt-3.5-turbo
        backend: default-ollama
        target_model: llama3
